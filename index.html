<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lámoree · Photobook Reader</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=DM+Sans:wght@200;300;400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ══════════════════════════════════════════
       UPLOAD SCREEN
  ══════════════════════════════════════════ -->
  <div id="upload-screen">

    <div class="upload-bg">
      <div class="upload-bg__img upload-bg__img--1"></div>
      <div class="upload-bg__img upload-bg__img--2"></div>
      <div class="upload-bg__img upload-bg__img--3"></div>
      <div class="upload-bg__overlay"></div>
    </div>

    <div class="upload-content">
      <div class="brand">
        <div class="brand__rule"></div>
        <h1 class="brand__name"><em>Lá</em>moree</h1>
        <p class="brand__tagline">Photobook Reader</p>
        <div class="brand__rule"></div>
      </div>

      <label class="drop-zone" id="drop-zone">
        <input type="file" id="file-input" accept="application/pdf" />
        <div class="drop-zone__inner">
          <div class="drop-zone__icon">
            <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
              <polyline points="14 2 14 8 20 8"/>
              <line x1="12" y1="18" x2="12" y2="12"/>
              <polyline points="9 15 12 12 15 15"/>
            </svg>
          </div>
          <p class="drop-zone__text">Open a Photobook PDF</p>
          <p class="drop-zone__sub">Drop your file here, or click to browse</p>
          <div class="drop-zone__badge">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
            Stays on your device · Nothing uploaded
          </div>
        </div>
      </label>

      <p class="upload-hint">Supports any PDF · Renders at full native resolution</p>
    </div>

    <div class="corner corner--tl"></div>
    <div class="corner corner--tr"></div>
    <div class="corner corner--bl"></div>
    <div class="corner corner--br"></div>
  </div>

  <!-- ══════════════════════════════════════════
       READER SCREEN
  ══════════════════════════════════════════ -->
  <div id="reader-screen" style="display:none;">

    <div id="reader-bg"></div>

    <header class="top-bar">
      <div class="top-bar__brand"><em>Lá</em>moree</div>
      <div class="top-bar__title-wrap">
        <span class="top-bar__rule"></span>
        <span id="book-title" class="top-bar__title"></span>
        <span class="top-bar__rule"></span>
      </div>
      <button id="btn-new" class="top-bar__btn">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
        Library
      </button>
    </header>

    <div id="progress-wrap" style="display:none;">
      <div id="progress-bar"><div id="progress-fill"></div></div>
      <span id="progress-text">Opening…</span>
    </div>

    <div id="book-stage">
      <button class="arrow-btn" id="btn-prev" disabled>
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="15 18 9 12 15 6"/></svg>
      </button>

      <div id="book-wrap">
        <div class="book-glow"></div>

        <div id="book">
          <!-- shadows + page-edge thickness live under the pages -->
          <div class="under" id="under-l"></div>
          <div class="under" id="under-r"></div>

          <div class="page-slot" id="slot-left">
            <canvas id="canvas-left"></canvas>
            <div class="page-texture"></div>
            <div id="corner-back" title="Previous page"></div>
          </div>
          <div id="spine"></div>
          <div class="page-slot" id="slot-right">
            <canvas id="canvas-right"></canvas>
            <div class="page-texture"></div>
            <div id="corner-next" title="Next page"></div>
          </div>

          <!-- shadow thrown by the turning page -->
          <div id="cast"></div>

          <!-- the turning page: front face + back face -->
          <div id="leaf" class="fwd">
            <div class="leaf-face leaf-front">
              <canvas id="leaf-front"></canvas>
              <div class="leaf-shade" id="leaf-shade-front"></div>
            </div>
            <div class="leaf-face leaf-back">
              <canvas id="leaf-back"></canvas>
              <div class="leaf-shade" id="leaf-shade-back"></div>
            </div>
          </div>
        </div>

        <div class="book-shadow"></div>
      </div>

      <button class="arrow-btn" id="btn-next" disabled>
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="9 18 15 12 9 6"/></svg>
      </button>
    </div>

    <footer class="controls">
      <span id="page-info" class="controls__page">— / —</span>
      <div class="controls__scrubber-wrap">
        <input type="range" id="scrubber" min="0" step="1" value="0" />
      </div>
      <div class="controls__actions">
        <button class="ctrl-btn" id="btn-split" title="Split mode">Auto</button>
        <button class="ctrl-btn" id="btn-bg" title="Choose a background picture">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
        </button>
        <button class="ctrl-btn" id="btn-bg-clear" title="Remove background picture" style="display:none;">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
        <input type="file" id="bg-input" accept="image/*" hidden />
        <button class="ctrl-btn" id="btn-hide-ui" title="Hide controls (H)">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
        </button>
        <button class="ctrl-btn" id="btn-zoom-out" title="Zoom out">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
        </button>
        <button class="ctrl-btn" id="btn-zoom-in" title="Zoom in">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
        </button>
      </div>
    </footer>


    <button class="ctrl-btn" id="btn-show-ui" title="Show controls (H)">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"/></svg>
    </button>

  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="flipbook.js"></script>
</body>
</html>
